<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testing</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:#080a12;color:white;font-family:Arial,Helvetica,sans-serif}
.glow{position:absolute;width:65vmin;height:65vmin;border-radius:50%;background:radial-gradient(circle,#7c4dff30,transparent 68%);filter:blur(35px);animation:breathe 6s ease-in-out infinite;pointer-events:none}
main{text-align:center;position:relative;padding:24px}
h1{margin:0;font-size:clamp(64px,15vw,180px);font-weight:800;letter-spacing:-.07em;line-height:1.2;cursor:default}
h1 span{display:inline-block;animation:float 3s ease-in-out infinite;animation-delay:calc(var(--i)*.12s);background:linear-gradient(110deg,#c5b4ff 15%,#fff 35%,#8deaff 50%,#ad91ff 75%,#c5b4ff);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 26px #a484ff25)}
.line{width:120px;height:3px;margin:36px auto 0;background:#ffffff0d;border-radius:5px;overflow:hidden}
.line:after{content:'';display:block;height:100%;width:45%;border-radius:5px;background:linear-gradient(90deg,#ac8dff,#99ecff);animation:slide 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0);background-position:0% 50%}50%{transform:translateY(-16px);background-position:100% 50%}}
@keyframes slide{0%,100%{transform:translateX(-110%)}50%{transform:translateX(230%)}}
@keyframes breathe{50%{transform:scale(1.3);opacity:.6}}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main><h1 aria-label="Testing"><span aria-hidden="true" style="--i:0">T</span><span aria-hidden="true" style="--i:1">e</span><span aria-hidden="true" style="--i:2">s</span><span aria-hidden="true" style="--i:3">t</span><span aria-hidden="true" style="--i:4">i</span><span aria-hidden="true" style="--i:5">n</span><span aria-hidden="true" style="--i:6">g</span></h1><div class="line" aria-hidden="true"></div></main>
</body>
</html>
